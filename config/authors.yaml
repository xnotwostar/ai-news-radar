# Phrase-level blacklist: any tweet matching these is dropped before
# the clustering stage. Patterns are compiled case-insensitive.
# (Also mirrored inline in apify_client.SPAM_PATTERNS for hot-path performance.)
blacklist_patterns:
  - "comment ['\"]?\\w+['\"]? (and|&) i ?'ll dm"
  - "i ?'ll (dm|send) you (my|the) (guide|prompts?|workflow|automation)"
  - "^\\s*\\d{1,2} ai tools to level up"
  - "^\\s*\\d{1,2} (ai|free) tools that will"
  - "thread[:🧵]+\\s*\\d+ ai tools"
  - "steal (these|my) (prompts?|automations?)"
  - "follow me for more ai"

# Per-author daily cap. Applied AFTER dedup so quota reflects final kept tweets.
per_author_daily_cap: 3
