# Used by Ranker (tier weighting) and ApifyCollector (tier tagging).
#
# tier priorities (higher = more signal weight in Ranker):
#   s_investor      4.0  投资人 / thesis 驱动的声音
#   s_founder       3.0  关键公司创始人、官方权威
#   a_engineering   2.0  一线工程 / 产品专家
#   b_research      1.0  研究者 / arxiv 过滤者
#   downweight      0.3  降权保留（原有创作者 list，作为叙事信号独立栏）
#   unknown         1.0  默认权重（非白名单）

