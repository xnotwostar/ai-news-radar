# T0 一手真相 · 官方 changelog / release notes / research blogs
# 这些源是事实层（公司说什么），不是评论层。
# 权重最高，因为不会被叙事污染。
#
# tier:    T0 = primary truth (official statements)
# category: changelog | research | strategy | hardware
# lookback_hours: per-feed time window (default 24). T0/T1 低频源放宽到 72 因为
#   多数大厂博客 1-2 天发一次。

changelogs:
  # ── 模型公司一手 blog ─────────────────────
  - name: "OpenAI Blog"
    rss_url: "https://openai.com/news/rss.xml"
    tier: T0
    category: changelog
    weight: 4.0
    keyword_filter: false
    lookback_hours: 72

  - name: "Anthropic News"
    rss_url: "https://rsshub.rssforever.com/anthropic/news"
    tier: T0
    category: changelog
    weight: 4.0
    keyword_filter: false
    lookback_hours: 72
    notes: "走 rssforever 镜像（rsshub.app 经常 403）"

  - name: "Google DeepMind"
    rss_url: "https://deepmind.google/blog/feed/"
    tier: T0
    category: research
    weight: 4.0
    keyword_filter: false
    lookback_hours: 168   # weekly cadence

  - name: "Hugging Face Blog"
    rss_url: "https://huggingface.co/blog/feed.xml"
