report_generation:
  - provider: google
    model: gemini-2.5-pro
    priority: 1
    timeout: 600
  - provider: dashscope
    model: qwen-plus
    priority: 2
    timeout: 600
  - provider: deepseek
    model: deepseek-chat
    priority: 3
    timeout: 600

data_processing:
  - provider: dashscope
    model: qwen-plus
    priority: 1
    timeout: 30

embedding:
  # Primary: Google Gemini (free tier generous, OpenAI-compat endpoint)
  # Fallback (auto): dashscope text-embedding-v4 (used if GOOGLE_API_KEY missing or fails)
  provider: google
  model: gemini-embedding-001
  dimensions: 3072
