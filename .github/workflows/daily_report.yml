name: Daily AI Report

on:
  schedule:
    - cron: '30 22 * * *'    # UTC 22:30 = 北京时间 06:30
  workflow_dispatch:
    inputs:
      no_dedup:
        description: '跳过历史查重'
        type: boolean
        default: false

permissions:
  contents: write
  pages: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (generate report + render HTML)
        timeout-minutes: 30
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_GLOBAL_LIST_ID: ${{ secrets.APIFY_GLOBAL_LIST_ID }}
          APIFY_CHINA_LIST_ID: ${{ secrets.APIFY_CHINA_LIST_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NO_OBSIDIAN: "1"   # Obsidian sync runs locally on user's mac, not in CI
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.no_dedup }}" = "true" ]; then
            EXTRA_ARGS="--no-dedup"
          fi
          python -m src.pipeline $EXTRA_ARGS

      - name: Persist data and deploy reports
        run: |
          git config user.name "AI News Radar Bot"
          git config user.email "bot@ai-news-radar"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "daily: $(date +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for Pages deployment..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '.status' 2>/dev/null || echo "unknown")
            echo "  Attempt $i/30: status=$STATUS"
            if [ "$STATUS" = "built" ]; then
              echo "Pages deployed successfully!"
              break
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
